name: CI Pipeline

on:
  push:
    branches: [student]
  pull_request:
    branches: [master, student]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm build
